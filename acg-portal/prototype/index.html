  const title='Add investor',cta='Add investor';
  const fields='<div><div style="font-size:.6rem;font-weight:700;letter-spacing:.12em;color:#a87e45;margin-bottom:7px">LEGAL NAME</div><input id="cName" placeholder="Full legal name or entity" style="width:100%;border:1px solid rgba(12,31,61,.14);border-radius:11px;padding:11px 14px;font-size:.86rem;color:#0c1f3d;background:#fff;outline:none"></div><div><div style="font-size:.6rem;font-weight:700;letter-spacing:.12em;color:#a87e45;margin-bottom:7px">EMAIL</div><input id="cEmail" placeholder="investor@example.com" style="width:100%;border:1px solid rgba(12,31,61,.14);border-radius:11px;padding:11px 14px;font-size:.86rem;color:#0c1f3d;background:#fff;outline:none"></div><div style="font-size:.74rem;color:#8b93a3">Creates the investor in Awaiting. Set the note terms and provision a login from the investor\'s detail panel.</div>';
  return '<div style="position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px"><div data-act="closeCompose" style="position:absolute;inset:0;background:rgba(11,29,58,.5)"></div><div style="position:relative;width:460px;max-width:94vw;background:#faf7f0;border-radius:18px;box-shadow:0 50px 100px -24px rgba(11,29,58,.55);overflow:hidden"><div style="padding:20px 24px;border-bottom:1px solid rgba(12,31,61,.08);display:flex;align-items:center;justify-content:space-between"><div style="font-size:1.05rem;font-weight:800">'+title+'</div><button data-act="closeCompose" style="width:32px;height:32px;border-radius:8px;color:#5b6473;display:flex;align-items:center;justify-content:center">'+ic('x',{size:17,sw:2})+'</button></div><div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px">'+fields+'</div><div style="padding:0 24px 22px;display:flex;gap:10px;justify-content:flex-end"><button data-act="closeCompose" style="padding:11px 18px;border-radius:10px;background:#fff;border:1px solid rgba(12,31,61,.14);font-size:.84rem;font-weight:600;color:#5b6473">Cancel</button><button data-act="submitCompose" style="padding:11px 22px;border-radius:10px;background:#0071e3;color:#fff;font-size:.84rem;font-weight:700">'+cta+'</button></div></div></div>';
}

// =====================================================================
// RENDER
// =====================================================================
function currentView(){
  if(state.mode==='investor'){return ({overview:ivOverview,schedule:ivSchedule,documents:ivDocuments,profile:ivProfile}[state.iv]||ivOverview)();}
  return ({overview:tvOverview,investors:tvInvestors,create:tvCreate}[state.tv]||tvOverview)();
}
function render(){
  let html;
  if(!state.auth){html=gateView();}
  else{html='<div style="display:flex;height:calc(100vh - 34px);overflow:hidden;background:#0b1d3a">'+sidebar()+'<main style="flex:1;min-width:0;background:#faf7f0;display:flex;flex-direction:column;overflow:hidden;border-top-left-radius:14px;border-bottom-left-radius:14px;position:relative">'+topbar()+'<div class="acg-scroll" style="flex:1;overflow:auto">'+currentView()+'</div></main></div>'+detailOverlay()+composeOverlay();}
  if(state.toast)html+='<div style="position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:95;background:#0b1d3a;color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 18px 44px -10px rgba(11,29,58,.55);font-size:.84rem;font-weight:600;display:flex;align-items:center;gap:10px">'+ic('check',{size:16,sw:2.6,color:'#7fd6a6'})+esc(state.toast)+'</div>';
  document.getElementById('app').innerHTML=html;
  scrollMsgs();
  var rs=document.getElementById('rosterSearch');if(rs)rs.addEventListener('input',onRosterSearch);
}
function onRosterSearch(e){var q=e.target.value.trim().toLowerCase();document.querySelectorAll('.rosterRow').forEach(function(row){row.style.display=(!q||row.getAttribute('data-name').indexOf(q)>=0)?'':'none';});}

// =====================================================================
// HANDLERS
// =====================================================================
const H={
  roleInv:()=>{state.role='investor';render();},
  roleTeam:()=>{state.role='team';render();},
  signIn:()=>{state.auth=true;state.mode=state.role==='team'?'team':'investor';state.iv='overview';state.tv='overview';render();toast(state.role==='team'?'Signed in — Team console':'Welcome back, Margaret');},
  signOut:()=>{state.auth=false;state.detail=null;state.compose=null;render();},
  go:(el)=>{var v=el.getAttribute('data-view');if(state.mode==='investor')state.iv=v;else state.tv=v;render();},
  goTeam:()=>{state.mode='team';state.tv='overview';render();},
  goInvestor:()=>{state.mode='investor';state.iv='overview';render();},
  toggle:(el)=>{var k=el.getAttribute('data-k');state.toggles[k]=!state.toggles[k];render();},
  caInd:()=>{state.ca.type='Individual';render();},
  caEnt:()=>{state.ca.type='Entity';render();},
  caReq:()=>{state.ca.requirePw=!state.ca.requirePw;render();},
  caGenPass:()=>{var el=document.getElementById('caPass');if(!el)return;var c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',p='';for(var i=0;i<14;i++)p+=c[Math.floor(Math.random()*c.length)];el.value=p+'2a';},
  createAccount:()=>{var g=v=>((document.getElementById(v)||{}).value||'').trim();var name=g('caName'),email=g('caEmail');if(!name||!email){toast('Enter a legal name and contact email');return;}var p=g('caPrincipal'),r=g('caRate'),mat=g('caMaturity'),st=g('caStatus')||'Awaiting';var login=g('caLoginEmail')||email;var matDisp=mat?(function(){var d=new Date(mat+'T00:00:00Z');return MO[d.getUTCMonth()]+' '+d.getUTCDate()+', '+d.getUTCFullYear();})():'—';state.investors.push({id:uid(),name:name,type:state.ca.type,state:st,principal:p?('$'+p.replace(/^\$/,'')):'—',rate:r?(r+'%'):'—',term:'—',email:login,wire:'—',maturity:matDisp,hasLogin:true});state.ca={type:'Individual',requirePw:true};state.tv='investors';render();toast('Account created — share the login with the investor (demo — resets on refresh)');},
  addInvestor:()=>{state.compose={kind:'investor'};render();},
  closeCompose:()=>{state.compose=null;render();},
  submitCompose:()=>{var c=state.compose;if(!c)return;
    var name=((document.getElementById('cName')||{}).value||'').trim();var email=((document.getElementById('cEmail')||{}).value||'').trim();if(!name||!email){toast('Enter a name and email');return;}state.investors.push({id:uid(),name:name,type:'Individual',state:'Awaiting',principal:'—',rate:'—',term:'—',email:email,wire:'—',maturity:'—',hasLogin:false});state.compose=null;state.tv='investors';render();toast('Investor added — set note terms & login next');},
  openDetail:(el)=>{state.detail=el.getAttribute('data-id');render();},
  closeDetail:()=>{state.detail=null;render();},
  saveNote:(el)=>{var id=el.getAttribute('data-id');var g=v=>((document.getElementById(v)||{}).value||'').trim();var p=g('mnPrincipal'),r=g('mnRate'),mat=g('mnMaturity'),st=g('mnStatus')||'Awaiting';var matDisp=mat?(function(){var d=new Date(mat+'T00:00:00Z');return MO[d.getUTCMonth()]+' '+d.getUTCDate()+', '+d.getUTCFullYear();})():'—';state.investors=state.investors.map(function(v){return v.id===id?Object.assign({},v,{state:st,principal:p?('$'+p.replace(/^\$/,'')):v.principal,rate:r?(r+'%'):v.rate,maturity:mat?matDisp:v.maturity}):v;});state.detail=null;render();toast('Note terms saved — schedule updated');},
  genPass:()=>{var el=document.getElementById('clPass');if(!el)return;var c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',p='';for(var i=0;i<14;i++)p+=c[Math.floor(Math.random()*c.length)];el.value=p+'2a';},
  setLogin:(el)=>{var id=el.getAttribute('data-id');var email=((document.getElementById('clEmail')||{}).value||'').trim();var pass=((document.getElementById('clPass')||{}).value||'').trim();if(!email){toast('Enter a login email');return;}if(pass.length<10){toast('Password must be at least 10 characters');return;}state.investors=state.investors.map(function(v){return v.id===id?Object.assign({},v,{hasLogin:true,email:email}):v;});render();toast('Login set — share '+email+' + password with the investor');},
  changePw:()=>{var cur=((document.getElementById('pwCur')||{}).value||''),nw=((document.getElementById('pwNew')||{}).value||'');if(!cur){toast('Enter your current password');return;}if(nw.length<10){toast('New password must be at least 10 characters');return;}var a=document.getElementById('pwCur'),b=document.getElementById('pwNew');if(a)a.value='';if(b)b.value='';toast('Password updated');},
  filter:(el)=>{state.filter=el.getAttribute('data-f');render();},
  download:(el)=>{toast('Downloading '+el.getAttribute('data-name'));}
};

// event delegation
document.getElementById('app').addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act');
  if(H[act]){e.preventDefault();H[act](el);}
});
render();
})();
</script>
</body>
</html>
