# Production stack behind Cloudflare: Postgres + the portal + a Cloudflare Tunnel.
#
# Nothing here publishes a port. The only way in is the tunnel, so the server
# needs no inbound firewall rules, no public IP, and no TLS certificate of its
# own — Cloudflare terminates HTTPS on your domain and forwards to `app:3000`.
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.cloudflare.yml --env-file .env.production up -d --build
#
# Full walkthrough: CLOUDFLARE_DEPLOY.md

name: acg-portal

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: acg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: acg_portal
    volumes:
      - acg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acg -d acg_portal']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Defaults to the bundled Postgres above. Set DATABASE_URL in
      # .env.production to use a managed database instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql://acg:${POSTGRES_PASSWORD:-}@db:5432/acg_portal?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env.production}
      DOCUMENT_URL_SECRET: ${DOCUMENT_URL_SECRET:?set DOCUMENT_URL_SECRET in .env.production}
      APP_URL: ${APP_URL:?set APP_URL in .env.production}
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  cloudflared:
    # Pin to a dated release tag once the stack is live.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env.production}
    depends_on:
      app:
        condition: service_healthy

volumes:
  acg_pgdata:
